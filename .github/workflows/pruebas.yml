name: Pruebas

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  pruebas:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Instalar FFmpeg y fuentes
        run: sudo apt-get -o Acquire::Retries=3 update && sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends ffmpeg fonts-dejavu-core
      - name: Versión de FFmpeg
        run: ffmpeg -version | head -1
      - name: Instalar el paquete
        run: pip install -e ".[dev]"
      - name: Pruebas de Python
        run: pytest -v
      - name: Pruebas del teleprompter
        run: node --test "tests/*.test.js"
